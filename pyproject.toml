[project]
name = "paidup"
version = "0.1.0"
description = "Political transparency tool — see who funds UK and US politicians"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "pillow>=10.0",
    "anthropic>=0.40",
    "redis>=8.0.0",
    "psycopg2-binary>=2.9.12",
    "scikit-learn>=1.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
