[project]
name = "paidup"
version = "0.1.0"
description = "Political transparency tool — see who funds UK and US politicians"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "pillow>=10.0",
    "anthropic>=0.40",
    "rapidfuzz>=3.14.5",
    "redis>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.uv]
package = true
